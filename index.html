<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORÁCULO DOS LEILÕES | Inteligência & ROI Imobiliário</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f1f5f9; }
    .glass { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.75); }
    .card-hover { transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease; }
    .card-hover:hover { transform: translateY(-2px); border-color: #10b981; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.16); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- BARRA DE STATUS DE SINCRONIZAÇÃO -->
  <div id="status-banner" class="bg-slate-900 border-b border-slate-800 px-4 py-2 text-xs flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2">
      <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
      <span id="status-text" class="text-slate-300 font-medium">Iniciando motor de dados...</span>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span id="status-count" class="text-slate-400 mr-1"></span>
      <label class="bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 px-2.5 py-1 rounded font-semibold transition cursor-pointer">
        📂 Importar JSON
        <input type="file" accept=".json" onchange="importarArquivoManual(event)" class="hidden" />
      </label>
      <button type="button" onclick="carregarDados()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 px-2.5 py-1 rounded font-semibold transition cursor-pointer">
        ↻ Sincronizar Agora
      </button>
    </div>
  </div>

  <!-- HEADER PRINCIPAL -->
  <header class="sticky top-0 z-30 glass border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center font-extrabold text-slate-950 text-lg shadow-lg shadow-emerald-500/20">
          O
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-lg tracking-tight text-white">ORÁCULO DOS LEILÕES</h1>
            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">PRO IA</span>
          </div>
          <p class="text-xs text-slate-400">Inteligência & ROI de Leilões Imobiliários</p>
        </div>
      </div>

      <!-- NAVEGAÇÃO DE ABAS -->
      <nav class="flex flex-wrap items-center gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-slate-800">
        <button type="button" onclick="mudarAba('radar')" id="tab-radar" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 text-slate-950 transition cursor-pointer">
          🎯 Radar de Oportunidades
        </button>
        <button type="button" onclick="mudarAba('gpt')" id="tab-gpt" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition cursor-pointer">
          🤖 Oráculo GPT
        </button>
        <button type="button" onclick="mudarAba('edital')" id="tab-edital" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition cursor-pointer">
          ⚖️ Analisador Edital IA
        </button>
        <button type="button" onclick="mudarAba('financiamento')" id="tab-financiamento" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition cursor-pointer">
          🏦 Financiamento
        </button>
        <button type="button" onclick="mudarAba('whatsapp')" id="tab-whatsapp" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition cursor-pointer">
          📲 Radar WhatsApp
        </button>
      </nav>

      <!-- BOTÃO CUSTOS GLOBAIS -->
      <button type="button" onclick="togglePainelCustos()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-xl text-xs font-semibold text-white transition cursor-pointer">
        <span>⚙️ Meus Custos Globais</span>
        <span id="badge-custos" class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-bold">10
