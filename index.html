<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORÁCULO DOS LEILÕES | Inteligência & ROI</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #090d16; color: #f1f5f9; }
    .top { background: #0f172a; padding: 14px 20px; border-bottom: 1px solid #26334d; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn { background: #10b981; color: #03150e; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-sec { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .wrap { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    input, select { background: #0f172a; color: #fff; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: #0f172a; border: 1px solid #26334d; border-radius: 12px; padding: 16px; }
    .tag { display: inline-block; background: #10b98122; color: #10b981; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .price { font-size: 20px; font-weight: bold; margin: 10px 0 4px; color: #fff; }
    .muted { color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <strong>ORÁCULO DOS LEILÕES</strong> — <span id="status" class="muted">Carregando...</span>
    </div>
    <div style="display:flex;gap:8px;">
      <label class="btn-sec">📂 Importar CSV Caixa / JSON <input type="file" accept=".csv,.json" onchange="lerArquivo(event)" style="display:none"></label>
      <button class="btn" onclick="iniciar()">↻ Atualizar</button>
    </div>
  </div>

  <div class="wrap">
    <div class="filters">
      <input id="q" placeholder="Buscar cidade, bairro ou título..." oninput="filtrar()" style="flex:1;min-width:200px;">
      <select id="uf" onchange="filtrar()"><option value="">Todos os Estados</option></select>
      <select id="ordem" onchange="filtrar()">
        <option value="score">Maior Score</option>
        <option value="menor">Menor Lance</option>
      </select>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    const DEMO = [
      { id: 'CX-01', titulo: 'Apartamento 2Q - Zona 07', cidade: 'Maringá', uf: 'PR', lance2: 198000, avaliacao: 340000, score: 9.4, portal: 'Caixa Online', url: 'https://venda-imoveis.caixa.gov.br/' },
      { id: 'CX-02', titulo: 'Casa Residencial - Jd. Alvorada', cidade: 'Maringá', uf: 'PR', lance2: 275000, avaliacao: 480000, score: 9.1, portal: 'Kronberg Leilões', url: 'https://www.kronbergleiloes.com.br/' },
      { id: 'SB-03', titulo: 'Apto Frente Mar - Meia Praia', cidade: 'Itapema', uf: 'SC', lance2: 410000, avaliacao: 680000, score: 9.3, portal: 'Superbid', url: 'https://www.superbid.net/' }
    ];
    let LOTES = [];
    const BRL = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });

    function montarUFs() {
      const sel = document.getElementById('uf');
      const ufs = [...new Set(LOTES.map(l => l.uf).filter(Boolean))].sort();
      sel.innerHTML = '<option value="">Todos os Estados</option>' + ufs.map(u => `<option value="${u}">${u}</option>`).join('');
    }

    function filtrar() {
      const q = document.getElementById('q').value.toLowerCase();
      const uf = document.getElementById('uf').value;
      const ord = document.getElementById('ordem').value;
      let lista = LOTES.filter(l => (!uf || l.uf === uf) && (!q || `${l.titulo} ${l.cidade} ${l.portal}`.toLowerCase().includes(q)));
      lista.sort((a, b) => ord === 'menor' ? a.lance2 - b.lance2 : b.score - a.score);
      document.getElementById('grid').innerHTML = lista.slice(0, 60).map(l => {
        const desc = l.avaliacao > 0 ? Math.round(((l.avaliacao - l.lance2) / l.avaliacao) * 100) : 0;
        return `<div class="card">
          <span class="tag">⭐ ${l.score} • -${desc}%</span>
          <div class="muted" style="margin-top:8px;">${l.cidade}/${l.uf} • ${l.portal}</div>
          <div style="font-weight:bold;font-size:15px;margin:4px 0;">${l.titulo}</div>
          <div class="price">${BRL(l.lance2)}</div>
          <div class="muted">Avaliação: ${BRL(l.avaliacao)}</div>
          <div style="margin-top:12px;"><a href="${l.url}" target="_blank" class="btn" style="text-decoration:none;display:inline-block;">Ver Edital ↗</a></div>
        </div>`;
      }).join('');
    }

    async function iniciar() {
      const st = document.getElementById('status');
      try {
        const r = await fetch('./imoveis.json?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        const arr = Array.isArray(d) ? d : (d.lotes || []);
        if (!arr.length) throw new Error('Base vazia');
        LOTES = arr;
        st.textContent = `Sincronizado (${LOTES.length} imóveis)`;
      } catch (e) {
        LOTES = DEMO;
        st.textContent = `Modo Demo (${e.message})`;
      }
      montarUFs();
      filtrar();
    }

    function lerArquivo(ev) {
      const f = ev.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = e => {
        const txt = e.target.result;
        if (f.name.toLowerCase().endsWith('.csv')) {
          LOTES = txt.split('\n').slice(4).map(linha => {
            const c = linha.split(';').map(s => s.trim());
            const p = parseFloat((c[5] || '0').replace(/\./g, '').replace(',', '.'));
            const av = parseFloat((c[6] || '0').replace(/\./g, '').replace(',', '.'));
            if (c.length < 10 || p <= 15000) return null;
            const id13 = c[0].replace(/\D/g, '').padStart(13, '0');
            return { id: 'CX-' + id13, titulo: (c[3] || c[2]) + ' - ' + (c[4] || ''), cidade: c[2], uf: c[1], lance2: p, avaliacao: av, score: 8.8, portal: 'Caixa', url: `https://venda-imoveis.caixa.gov.br/sistema/detalhe-imovel.asp?hdnImovel=${id13}` };
          }).filter(Boolean);
          document.getElementById('status').textContent = `CSV Caixa carregado (${LOTES.length} imóveis)`;
        } else {
          const j = JSON.parse(txt);
          LOTES = Array.isArray(j) ? j : (j.lotes || []);
          document.getElementById('status').textContent = `JSON carregado (${LOTES.length} imóveis)`;
        }
        montarUFs();
        filtrar();
      };
      rd.readAsText(f, f.name.toLowerCase().endsWith('.csv') ? 'ISO-8859-1' : 'UTF-8');
    }

    iniciar();
  </script>
</body>
</html>
